[package]
name = "lib-consensus"
version = "0.1.0"
edition = "2021"
authors = ["ZHTP Developers"]
description = "ZHTP Consensus Engine - Multi-layered consensus with PoS, PoStorage, PoUW, and Byzantine Fault Tolerance"
license = "MIT"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
hex = "0.4"
bincode = "1.3"
scopeguard = "1.2"

# ZHTP package dependencies
lib-types = { path = "../lib-types" }
lib-crypto = { path = "../lib-crypto" }
lib-identity = { path = "../lib-identity" }
lib-storage = { path = "../lib-storage" }
lib-proofs = { path = "../lib-proofs" }
# Port traits live here. lib-consensus-core has no knowledge of lib-consensus —
# the dependency points one way only (CONS-103, AD-002, AD-005).
lib-consensus-core = { path = "../lib-consensus-core" }
# CONS-501: `validator_discovery` migrated to `lib-consensus-net`. Re-exported
# from this crate's `validators::validator_discovery` so internal callers
# don't break. The other 3 modules (codec, heartbeat, validator_protocol)
# stay here until CONS-201 Scope B resolves the `ConsensusProof` /
# lib-storage dep cycle (they transitively reference `StorageCapacityAttestation`,
# which AD-002 forbids in `lib-consensus-core`).
lib-consensus-net = { path = "../lib-consensus-net" }
# DAO engine relocated to lib-governance per CONS-106 / AD-003. Imported back
# for the synchronous validation paths (apply_governance_update_from_proposal)
# that need direct access to validate/decode/apply on a configured DaoEngine.
# The fire-and-forget round-finalize path uses lib-consensus-core's
# GovernanceCallback trait instead.
lib-governance = { path = "../lib-governance" }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Collections and data structures
indexmap = "1.9"
dashmap = "5.4"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
tracing-subscriber = "0.3"

[features]
default      = []
testing      = []
dev-insecure = []
