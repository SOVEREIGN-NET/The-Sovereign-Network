[package]
name = "lib-governance"
version = "0.1.0"
edition = "2021"
description = "ZHTP Governance - Deterministic configuration updates"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
blake3 = "1.5"
bincode = "1.3"
anyhow = "1.0"
tracing = "0.1"
# CONS-106: dao_engine uses async + the consensus_adapter blocks on a
# Tokio runtime handle. The runtime feature is needed for `tokio::runtime::Handle`.
tokio = { version = "1.0", features = ["rt", "macros", "sync"] }

# Internal dependencies
lib-types = { path = "../lib-types" }
lib-access-control = { path = "../lib-access-control" }
lib-crypto = { path = "../lib-crypto" }
lib-identity = { path = "../lib-identity" }
# Implements lib-consensus-core::ports::GovernanceCallback (CONS-106 / AD-005).
# One-way dep: lib-consensus-core defines the trait, lib-governance impls it.
lib-consensus-core = { path = "../lib-consensus-core" }

[dev-dependencies]
serde_json = "1.0"
