[package]
name = "lib-consensus-net"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Network Team"]
license = "MIT OR Apache-2.0"
description = "Wire format + transport adapters for lib-consensus-core."

# AD-003 (docs/epics/consensus-rewrite-decisions.md):
# Houses code currently in lib-consensus/src/{network/codec.rs,network/heartbeat.rs,
# validators/validator_protocol.rs,validators/validator_discovery.rs}.
[dependencies]
lib-consensus-core = { path = "../lib-consensus-core" }
# CONS-501: `lib-network` is intentionally NOT a dep here. The discovery
# module migrated in this PR has zero `lib-network` references; the
# remaining stub modules (codec, heartbeat, validator_protocol) will
# need it when CONS-201 Scope B unblocks their move, at which point
# the dep is re-added — but only after the lib-blockchain → lib-network
# → lib-consensus-net → lib-consensus → lib-blockchain cycle is broken
# by retiring `lib-consensus`'s `lib-network` use (CONS-507).
lib-crypto         = { path = "../lib-crypto" }
lib-identity       = { path = "../lib-identity" }
lib-types          = { path = "../lib-types" }
anyhow             = "1.0"
serde              = { version = "1.0", features = ["derive"] }
thiserror          = "1.0"
tracing            = "0.1"
async-trait        = "0.1"
tokio              = { version = "1.0", features = ["sync", "rt", "macros", "time"] }
bincode            = "1.3"

[dev-dependencies]
tokio              = { version = "1.0", features = ["full"] }
rand               = "0.8"
