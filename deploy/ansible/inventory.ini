[zhtp_dev]
# Hosts are loaded from environment variables to keep credentials out of
# version control.  Copy deploy/ansible/.env.example to .env, fill in your
# values, then source it before running Ansible:
#
#   cp .env.example .env   # edit with real values
#   source .env
#   ansible-playbook playbook.yml

[zhtp_dev:vars]
ansible_python_interpreter=/usr/bin/python3
