[package]
name = "tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "identity_e2e_sim"
path = "identity_e2e_sim.rs"

[[bin]]
name = "chain_audit"
path = "chain_audit.rs"

[[bin]]
name = "wallet_probe"
path = "wallet_probe.rs"

[[bin]]
name = "sled_migration"
path = "sled_migration.rs"

[[bin]]
name = "testnet_reset"
path = "testnet_reset.rs"

[dependencies]
lib-identity = { path = "../lib-identity" }
lib-protocols = { path = "../lib-protocols" }
lib-network = { path = "../lib-network" }
lib-crypto = { path = "../lib-crypto" }
lib-blockchain = { path = "../lib-blockchain" }
# chain_audit / testnet_reset / replay_wallets reference `lib_types::sov::*`
# but this manifest never declared the dep — pre-existing workspace breakage.
lib-types = { path = "../lib-types" }
hex = "0.4"
anyhow = "1"
clap = { version = "4.0", features = ["derive"] }
sled = "0.34"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1"
serde_json = "1"
dirs = "5"
tempfile = "3"

[[bin]]
name = "regen_cbe_key"
path = "regen_cbe_key.rs"

[[bin]]
name = "export_replay_fixture"
path = "export_replay_fixture.rs"

[[bin]]
name = "replay_divergence"
path = "replay_divergence.rs"
