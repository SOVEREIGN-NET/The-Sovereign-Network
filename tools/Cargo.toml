[package]
name = "tools"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "identity_e2e_sim"
path = "identity_e2e_sim.rs"

[[bin]]
name = "chain_audit"
path = "chain_audit.rs"

[[bin]]
name = "sled_migration"
path = "sled_migration.rs"

[[bin]]
name = "testnet_reset"
path = "testnet_reset.rs"

[dependencies]
lib-identity = { path = "../lib-identity" }
lib-protocols = { path = "../lib-protocols" }
lib-network = { path = "../lib-network" }
lib-crypto = { path = "../lib-crypto" }
lib-blockchain = { path = "../lib-blockchain" }
# Pre-existing workspace breakage: chain_audit / testnet_reset / replay_wallets
# all reference `lib_types::sov::*` but this manifest never declared the dep.
# CI `cargo build --workspace` fails on this on development too; adding here
# to get the S2 PR's required check green.
lib-types = { path = "../lib-types" }
hex = "0.4"
anyhow = "1"
sled = "0.34"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1"
serde_json = "1"
dirs = "5"

[[bin]]
name = "regen_cbe_key"
path = "regen_cbe_key.rs"
