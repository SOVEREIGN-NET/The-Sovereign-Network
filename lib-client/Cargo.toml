[package]
name = "lib-client"
version = "0.1.0"
edition = "2021"
description = "Cross-platform ZHTP client library for iOS, Android, Web, and CLI"
license = "MIT"
authors = ["The Sovereign Network"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "zhtp_client"

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "getrandom/js"]
uniffi = ["dep:uniffi"]

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
bincode = "1.3"
ciborium = "0.2"
hex = "0.4"
base64 = "0.21"
tracing = "0.1"

# Archive creation for keystore export
tar = "0.4"
flate2 = "1.0"

# Workspace dependencies for correct transaction serialization
lib-blockchain = { path = "../lib-blockchain" }
lib-crypto = { path = "../lib-crypto" }
lib-identity-core = { path = "../lib-identity-core" }

# Post-quantum crypto (native builds use C-based implementations)
blake3 = "1.5"
sha3 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
getrandom = "0.2"

# UniFFI (for mobile bindings)
uniffi = { version = "0.25", optional = true }

# Native: PQC implementations + QUIC transport for FFI session
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"  # Required for pqcrypto-kyber trait methods
crystals-dilithium = "1.0"
# Persistent QUIC session FFI (zhtp_quic_session_*). Reuses lib-network's
# UHP-handshake-aware ZhtpClient; only enabled for native mobile/CLI builds.
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net"] }
lib-network = { path = "../lib-network" }
lib-identity = { path = "../lib-identity" }
lib-protocols = { path = "../lib-protocols" }
# Lobby auth: OPAQUE (RFC 9497 / IETF CFRG draft) password-authenticated key
# exchange. Locked cipher suite: Ristretto255 + Sha512 + TripleDh + Argon2id.
opaque-ke = { version = "4", default-features = false, features = ["ristretto255", "argon2", "serde"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
generic-array = "0.14"

# Android JNI bindings
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# WASM: Pure Rust PQC implementations
[target.'cfg(target_arch = "wasm32")'.dependencies]
crystals-dilithium = "1.0"
pqc_kyber = { version = "0.7", features = ["kyber1024"] }

# WASM (optional, for web)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[build-dependencies]
uniffi = { version = "0.25", features = ["build"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wasm-bindgen-test = "0.3"
