[package]
name = "lib-proofs"
version = "0.1.0"
edition = "2021"
authors = ["ZHTP Team"]
description = "Zero-Knowledge Proof System for ZHTP - Production-ready ZK proofs with Plonky2"
license = "MIT"
repository = "https://github.com/SOVEREIGN-NETWORK/ZHTP"
keywords = ["zero-knowledge", "plonky2", "blockchain", "privacy", "cryptography"]
categories = ["cryptography", "mathematics"]

[dependencies]
# Core dependencies
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
log = "0.4"

# Cryptographic dependencies (using lib-crypto package)
lib-crypto = { path = "../lib-crypto" }
# NOTE on dep direction (CONS-104 / AD-003): the consensus-mechanism proof
# types (StakeProof, WorkProof, ProofOfUsefulWork) moved to
# `lib-proofs/src/consensus/` use `lib_crypto::Hash` directly instead of
# `lib_identity::IdentityId` because lib-identity already depends on lib-proofs
# (would create a cycle). `IdentityId` is a transparent alias for
# `lib_crypto::Hash` (see `lib-identity/src/types/identity_types.rs:8`), so
# this is a name-only difference at the call site.

# rand for nonce generation in consensus::work_proof::WorkProof::new (CONS-104).
rand = "0.8"

# CPU detection for parallel processing
num_cpus = "1.16"

# Serialization
bincode = "1.3"
serde_json = "1.0"
dirs = "5.0"

# Hash map for performance
ahash = "0.8"

# Real ZK backend: Plonky2
plonky2 = { version = "1.1.0", optional = true }
plonky2_field = { version = "1.0.0", optional = true }
bulletproofs = "5"
curve25519-dalek = { version = "4", features = ["alloc", "rand_core"] }
merlin = "3"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
criterion = "0.5"
serde_json = "1.0"
bulletproofs = "5"

[[bench]]
name = "zk_benchmarks"
harness = false

[[bench]]
name = "tx_benchmark"
harness = false
required-features = ["real-proofs"]

[lib]
name = "lib_proofs"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
# Enable real cryptographic proof backends (required for production builds)
real-proofs = ["plonky2", "plonky2_field"]
# Enable fake/mock proof paths for testing and migration ONLY.
# This feature MUST NOT be enabled in release or production builds.
fake-proofs = []
# Production feature for optimized circuits
production = ["real-proofs"]
# Development feature for testing
dev = ["fake-proofs"]
