[package]
name = "lib-consensus-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Network Team"]
license = "MIT OR Apache-2.0"
description = "ConsensusRuntime — single owner of orchestration glue. Owns the action executor, watchdog, catch-up sync, and fork-divergence policy."

# AD-006, AD-009, AD-010, AD-011, AD-012 (docs/epics/consensus-rewrite-decisions.md):
# Consolidates code currently scattered across
# zhtp/src/runtime/components/consensus.rs (catch-up sync, broadcaster +
# committer adapters) and lib-blockchain/src/integration/consensus_integration.rs
# (the parallel BlockchainConsensusCoordinator).
[dependencies]
lib-consensus-core = { path = "../lib-consensus-core" }
lib-consensus-net  = { path = "../lib-consensus-net" }
# CONS-502: temporary dep on lib-consensus while ConsensusEngine still lives
# there. Removed when CONS-104..108 finish migrating the engine into
# lib-consensus-core::engine. Tracked under CONS-508 (delete lib-consensus).
lib-consensus      = { path = "../lib-consensus" }
lib-blockchain     = { path = "../lib-blockchain" }
lib-network        = { path = "../lib-network" }
lib-crypto         = { path = "../lib-crypto" }
lib-identity       = { path = "../lib-identity" }
lib-types          = { path = "../lib-types" }
serde              = { version = "1.0", features = ["derive"] }
thiserror          = "1.0"
tracing            = "0.1"
anyhow             = "1.0"
async-trait        = "0.1"
tokio              = { version = "1.0", features = ["full"] }
bincode            = "1.3"

[dev-dependencies]
tokio              = { version = "1.0", features = ["full"] }
